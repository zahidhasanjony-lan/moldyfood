name: Render Remotion Motion Graphics Video

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      composition_id:
        description: 'Composition ID to render (MoldVideoWithHUD or MoldHUDAlphaOverlay)'
        required: true
        default: 'MoldVideoWithHUD'
      video_filename:
        description: 'Source video filename inside /public folder'
        required: true
        default: 'lv_0_20261114233803.mp4'

jobs:
  render-video:
    name: Render MP4 via Remotion Headless Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux Chromium & FFmpeg Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libdbus-1-3 \
            libatk1.0-0 \
            libgbm-dev \
            libxrandr2 \
            libxkbcommon-dev \
            libxfixes3 \
            libxcomposite1 \
            libxdamage1 \
            libatk-bridge2.0-0 \
            libpango-1.0-0 \
            libcairo2 \
            libcups2 \
            ffmpeg
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Install NPM Packages
        run: npm install

      - name: Download Source Video from Release v1.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p public
          gh release download v1.0 --pattern "*.mp4" --dir public --clobber
          ls -lh public/

      - name: Render Remotion Video
        run: |
          COMP_ID="${{ github.event.inputs.composition_id || 'MoldVideoWithHUD' }}"
          VID_FILE="${{ github.event.inputs.video_filename || 'lv_0_20261114233803.mp4' }}"
          npx remotion render src/index.ts "$COMP_ID" out/final-mold-hud.mp4 \
            --props="{\"videoFileName\": \"$VID_FILE\", \"transparentOverlayOnly\": false}" \
            --codec=h264 \
            --crf=18 \
            --concurrency=4 \
            --log=verbose

      - name: Upload Rendered Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-mold-hud-video
          path: out/final-mold-hud.mp4
          retention-days: 14
